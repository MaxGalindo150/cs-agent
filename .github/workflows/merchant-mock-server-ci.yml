name: Merchant Mock Server CI

on:
  pull_request:
    branches: [main]
    paths:
      - "merchant-mock-server/**"
      - "docker-compose.yml"
      - ".github/workflows/merchant-mock-server-ci.yml"
  push:
    branches: [main]
    paths:
      - "merchant-mock-server/**"
      - "docker-compose.yml"
      - ".github/workflows/merchant-mock-server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: merchant-mock-server

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build container
        working-directory: .
        run: docker build --file merchant-mock-server/Dockerfile merchant-mock-server
