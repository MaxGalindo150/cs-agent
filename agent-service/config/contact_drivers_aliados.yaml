# Contact drivers (CD) del canal Aliados — fuente: docs/propuesto-de-cd-aliados.md
#
# Lo consume la decisión `contact_driver` (Jev `choice` sobre `drivers[*].criteria`).
# Confianza >= threshold → el harness aplica `intercom_tag_id`, carga `skill` y
# recorta el catálogo a `tools`. Por debajo → sin CD (residual), sigue el loop.
# `always_escalate: true` es regla del harness, no decisión del modelo.

version: 2026-10-02
profile: merchant

decision:
  site: contact_driver
  threshold: 0.8
  # Si en el probe etiquetado la confianza cae < threshold en > 20 % de los
  # aciertos, preguntar primero `family` y luego el driver dentro de ella.
  two_level_fallback: false
  # Antes de preguntar: quitar etiquetas de botón del menú y la línea
  # "razón social / RIF / consulta"; sin texto restante no se pregunta.
  strip_menu_labels: true
  residual:
    label: sin_clasificar
    intercom_tag_id: null          # reemplaza a Otros (12271494) y Sin Tag (16253977)
    l1_attribute: "Sin contexto"
    action: ask_for_query

families:
  acceso:     "Entrar, recibir credenciales, cambiar un dato"
  tienda:     "Cobrar, anular, cerrar caja, QR, fraude"
  dinero:     "Liquidación, tarifas, modelo, reportes, retenciones, devoluciones"
  afiliacion: "Alta, etapa, kit, contrato"
  online:     "Activar la tienda, catálogo, envíos y órdenes del marketplace"
  otros:      "Campañas, cliente final, solicitudes de canal"

drivers:
  - id: acceso_clave
    cd: "CD - Acceso y clave"
    family: acceso
    intercom_tag_id: 16103148
    retire_tag_ids: [12933927, 16103107, 16103564]
    criteria: "No puede iniciar sesión en Merchant Web: olvidó o le rechazan la clave, el portal no carga, el código 2FA no llega, perdió el teléfono o el correo de acceso."
    subtypes: [clave_olvidada_o_rechazada, portal_no_carga, otp_no_llega, clave_mal_escrita, perdio_telefono_o_correo]
    skill: acceso-credenciales
    tools: [get_employee_2fa, register_2fa_phone]
    identity: validacion_seguridad
    capture: [correo_de_acceso, rol, captura_error, telefono_2fa]
    handoff: { inbox: "L2 - Bug Aliados", when: "persiste tras la clave nueva" }
    always_escalate: false

  - id: credenciales_no_recibidas
    cd: "CD - Credenciales no recibidas"
    family: acceso
    intercom_tag_id: 16103149
    criteria: "Terminó la afiliación o recibió el kit y nunca le llegaron usuario y clave; el correo está lleno o en spam; o pide credenciales para un cajero o gerente nuevo."
    subtypes: [no_llegaron_tras_kit, correo_lleno_o_spam, verificacion_de_correo, alta_de_empleado]
    skill: acceso-credenciales
    tools: []
    identity: validacion_seguridad
    capture: [razon_social, rif, correo_registrado, telefono_registrado, rol_solicitante, retiro_kit]
    handoff: { inbox: "L2 - Credenciales", slack: "#abm-solicitudes-inbound", flow: "Empleados - Reenviar info de usuarios", snooze_days: 15 }
    always_escalate: false

  - id: actualizar_datos
    cd: "CD - Actualizar datos"
    family: acceso
    intercom_tag_id: 16103150
    criteria: "Quiere cambiar un dato registrado: teléfono del código de reportes, correo de acceso, cuenta bancaria, logo, datos de contacto."
    subtypes: [telefono_2fa, correo_admin, cuenta_bancaria, logo_o_nombre, contacto_odoo]
