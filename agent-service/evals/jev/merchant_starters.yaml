# Mensajes de arranque del canal Aliados para probar la clasificación de CD.
#
# fuente: intercom → conversación cerrada de Intercom ATA (muestreo 2026-10-02).
#   Se quitaron botones del menú, saludos, razón social, RIF y montos de
#   identificación; se dejó la consulta en uno o dos mensajes.
# fuente: derivado → no hubo muestra real con contenido para ese CD; el texto
#   sale de los subtipos de Guru / Flow Readiness.
#
# esperado: id de driver en config/contact_drivers_aliados.yaml, o
#   `sin_clasificar` cuando no hay consulta clasificable (Jev debe quedar < threshold).
# tambien_valido: otros drivers aceptables en casos ambiguos.

