[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-service"
version = "0.1.0"
description = "Agent Service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.51.0",
    "pydantic-settings>=2.13.1",
    "anthropic>=0.117.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.1.0",
    "structlog>=25.5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.5.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
    "deepeval>=4.1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
# Alembic migration scripts are autogenerated; their long create_table lines and
# templated headers are not worth (or safe to) hand-reformatting. env.py itself
# is hand-written and stays linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

# deepeval ships no py.typed marker and its own ABC (DeepEvalBaseLLM) is
# effectively untyped (bare *args/**kwargs everywhere) — analyzing it under
# --strict produces friction that is about deepeval's stubs, not our code
# (evals/judge/anthropic_judge.py). Treated as Any at the boundary, same as
# any other unstubbed third-party dependency.
[[tool.mypy.overrides]]
module = "deepeval.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["src/agent", "src/service"]
branch = true
omit = [
    "src/service/main.py",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
